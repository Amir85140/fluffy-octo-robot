<script>
"use strict";

ping(){this.t(880,.16);this.t(1320,.2,"sine",.045,.08)},ok(){[523,659,784].forEach((f,i)=>this.t(f,.2,"triangle",.055,i*.08))},bad(){this.t(210,.3,"sawtooth",.05);this.t(150,.4,"sawtooth",.05,.13)}};

 cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+"px";const x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);

 if(!S||!S.me){$("#top").style.display="none";$("#app").innerHTML=authView();return}
 $("#top").style.display="flex";$("#mute").textContent=UI.mute?"🔇":"🔊";
 const isAdmin=S.me.role==="admin";
 const tabs=isAdmin?[["rating","🏆 Рейтинг"],["attacks","🎯 Атаки"],["agents","🖥 Агенты"],["journal","📜 Журнал"]]:[["self","👤 Мой агент"]];
 if(!tabs.some(t=>t[0]===UI.view))UI.view=tabs[0][0];
 $("#tabs").innerHTML=tabs.map(t=>`<button class="tab ${UI.view===t[0]?"on":""}" data-act="tab" data-v="${t[0]}">${t[1]}</button>`).join("");
 const c=S.campaign;
 $("#status").innerHTML=c.status==="active"?`<div class="pill live"><i></i>КАМПАНИЯ · ${c.delivered}</div>`:`<div class="pill">○ остановлена</div>`;
 const V=isAdmin?{rating:ratingView,attacks:attacksView,agents:agentsView,journal:journalView}:{self:selfView};
 $("#app").innerHTML=`<div class="view">${V[UI.view]()}</div>`;
 after();
}

function monitorCard(t){
 const a=t.attack||{},p=t.params||{},m=(t.metrics||[]).slice(-1)[0]||{};
 const keys=Object.keys(m).filter(k=>k!=="t"&&k!=="codes"&&k!=="ports");
 const live=t.status==="running";
 return `<div class="card glow"><div class="row"><span class="badge b${a.lvl||1}">L${a.lvl||1}</span>
 <b>${esc(a.name||"—")}</b><span class="badge ${live?"bg":"bc"}">${live?"ВЫПОЛНЯЕТСЯ РЕАЛЬНО":t.status}</span>
 <div class="spacer"></div><button class="btn sm bad" data-act="stop-task" data-id="${t.id}">■ Стоп</button></div>
 ${t.evidence?`<div class="evi" style="margin-top:11px">✔ ${esc(t.evidence)}</div>`:""}
 <div class="statline" style="margin-top:12px">${keys.slice(0,5).map((k,i)=>`<div class="st"><b style="color:${PAL[i%PAL.length]}">${typeof m[k]==="number"?Math.round(m[k]*10)/10:esc(m[k])}</b><span>${k}</span></div>`).join("")||`<div class="st"><b>—</b><span>ожидание телеметрии</span></div>`}</div>
 <canvas class="ch" id="monch"></canvas>
 <div class="layout" style="margin-top:12px;grid-template-columns:1fr 250px">
  <div class="logs" id="monlogs">${(t.logs||[]).map(l=>`<div class="lr ${l.l||""}"><span class="dim mono">${new Date((l.t||0)*1000).toLocaleTimeString("ru")}</span><span>${esc(l.m)}</span></div>`).join("")||'<div class="lr">ожидание…</div>'}</div>
  <div><h4 style="font-size:10.5px;letter-spacing:.15em;color:var(--cyan);margin-bottom:10px">ЖИВОЕ УПРАВЛЕНИЕ</h4>
  ${[["rps","Интенсивность RPS",5,400],["workers","Потоки атаки",1,64],["duration","Длительность, с",10,180],["rate","Темп попыток/с",1,30],["cpu_cap","Лимит CPU %",5,60],["spread_ms","Задержка шифрования",150,3000],["rate_limit","Rate limit цели",0,200],["work_ms","Тяжесть запроса, мс",0,40],["lockout","Порог блокировки",0,30],["files","Файлов",4,24]].filter(x=>x[0] in p).map(x=>
   `<div class="ctl"><label>${x[1]}<output>${p[x[0]]}</output></label><input type="range" data-live="${x[0]}" data-id="${t.id}" min="${x[2]}" max="${x[3]}" value="${p[x[0]]}"></div>`).join("")}
  ${[["tfa","2FA на цели"],["captcha","Задержка CAPTCHA"],["cache","Кэш на цели"],["breach_check","Проверка по утечкам"],["parameterized","Параметризация SQL"],["csp","CSP"],["sanitize","Экранирование"],["tls","TLS"],["dist","Ротация источников"]].filter(x=>x[0] in p).map(x=>
   `<div class="tgl"><span>${x[1]}</span><div class="sw ${p[x[0]]?"on":""}" data-act="live-tgl" data-k="${x[0]}" data-id="${t.id}"></div></div>`).join("")}
  ${a.module==="ransom"?`<button class="btn sm warn" style="width:100%;margin-bottom:6px" data-act="cmd" data-id="${t.id}" data-c="isolate">🔌 Изолировать</button>
   <button class="btn sm ok" style="width:100%;margin-bottom:6px" data-act="cmd" data-id="${t.id}" data-c="restore">💾 Восстановить файлы</button>`:""}
  ${a.module==="miner"?`<button class="btn sm ok" style="width:100%;margin-bottom:6px" data-act="cmd" data-id="${t.id}" data-c="kill">⚡ Убить майнер</button>`:""}
  </div></div></div>`;

function installCmd(token){
 const srv=location.origin;
 return `pip install -r requirements.txt\npython agent.py --enroll ${token} --server ${srv}\npython agent.py --install`;
}

  if(mon){UI.monitor=mon.id;const cv=$("#monch");
   if(cv){const ms=mon.metrics||[];const keys=Object.keys(ms[0]||{}).filter(k=>typeof ms[0][k]==="number"&&k!=="t").slice(0,2);
    line(cv,keys.map(k=>({l:k,d:ms.map(m=>m[k]||0)})),170)}
   const lg=$("#monlogs");if(lg)lg.scrollTop=lg.scrollHeight;}
  const f=$("#evfeed");if(f)f.innerHTML=(S.events||[]).slice(0,20).map(e=>`<div class="lr ${e.level==="bad"?"bad":e.level==="ok"?"ok":e.level==="warn"?"warn":""}"><span class="dim mono">${new Date(e.ts*1000).toLocaleTimeString("ru")}</span><span>${esc(e.message)}</span></div>`).join("");
  const q=$("#queue");if(q)bindDrag(q);
 }
}
function bindDrag(box){box.querySelectorAll("[data-qi]").forEach(el=>{
 el.ondragstart=e=>{UI.drag=+el.dataset.qi;el.classList.add("drag");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain","x")}catch(x){}};
 el.ondragend=()=>{el.classList.remove("drag");box.querySelectorAll(".over").forEach(x=>x.classList.remove("over"))};
 el.ondragover=e=>{e.preventDefault();el.classList.add("over")};
 el.ondragleave=()=>el.classList.remove("over");
 el.ondrop=async e=>{e.preventDefault();const to=+el.dataset.qi,from=UI.drag;if(from===null||from===to)return;
  const q=S.campaign.queue.slice();const [m]=q.splice(from,1);q.splice(to,0,m);UI.drag=null;
  await api("/api/campaign",{queue:q});refresh(true)};})}

  toast("Убрано из очереди","warn",async()=>{q.splice(+t.dataset.i,0,rm);await api("/api/campaign",{queue:q});refresh(true)});return}
 if(k==="quick-l1"){await api("/api/campaign",{queue:S.catalog.filter(a=>a.lvl<=2).map(a=>a.id),cfg:{ceiling:2}});refresh(true);return}
 if(k==="quick-all"){await api("/api/campaign",{queue:S.catalog.map(a=>a.id),cfg:{ceiling:5}});refresh(true);return}
 if(k==="rand-q"){const q=S.catalog.slice().sort(()=>Math.random()-.5).slice(0,8).map(a=>a.id);await api("/api/campaign",{queue:q});refresh(true);return}
 if(k==="save-preset"){const n=prompt("Название набора:","Мой набор");if(!n)return;
  await api("/api/presets",{name:n,queue:S.campaign.queue,cfg:{interval:S.campaign.cfg.interval,ceiling:S.campaign.cfg.ceiling}});toast("Набор сохранён","ok");refresh(true);return}
 if(k==="preset"){const p=S.presets.find(x=>x.id===t.dataset.id);await api("/api/campaign",{queue:p.queue,cfg:p.cfg});toast("Набор загружен","ok");refresh(true);return}
 if(k==="c-tgl"){await api("/api/campaign",{cfg:{[t.dataset.k]:!S.campaign.cfg[t.dataset.k]}});refresh(true);return}
 if(k==="c-target"){const tg=S.campaign.targets.slice();const i=tg.indexOf(t.dataset.id);i<0?tg.push(t.dataset.id):tg.splice(i,1);
  await api("/api/campaign",{targets:tg});refresh(true);return}
 if(k==="camp"){await api("/api/campaign/"+t.dataset.a);Snd.ok();toast(t.dataset.a==="start"?"Кампания запущена — агенты получат атаки":"Кампания "+t.dataset.a,"ok");refresh(true);return}
 if(k==="stop-task"){await api(`/api/task/${t.dataset.id}/stop`);toast("Останов задачи отправлен","warn");refresh(true);return}
 if(k==="cmd"){await api(`/api/task/${t.dataset.id}/command`,{command:t.dataset.c});Snd.ping();toast("Команда отправлена агенту","ok");refresh(true);return}
 if(k==="live-tgl"){const cur=(S.tasks.find(x=>x.id===t.dataset.id)||{}).params||{};
  await api(`/api/task/${t.dataset.id}/control`,{[t.dataset.k]:!cur[t.dataset.k]});refresh(true);return}
 if(k==="launch"){const sel=$("#sel-"+t.dataset.id);const r=await api("/api/launch",{agent_id:t.dataset.id,attack_id:sel.value});
  UI.monitor=r.task_id;UI.view="attacks";Snd.ping();toast("Атака запущена реально на машине сотрудника","ok");refresh(true);return}
 if(k==="kill"){await api(`/api/agent/${t.dataset.id}/kill`);toast("Kill-switch: задачи агента остановлены","bad");refresh(true);return}

 if(k==="new-enroll"){
  if(!(S.users||[]).length){toast("Сначала зарегистрируйте сотрудника","bad");return}
  drawer(`<div class="ovh"><span class="t">Установка агента</span><button class="x" data-act="dr-x">✕</button></div>

 if(k==="mk-enroll"){const r=await api("/api/enroll",{user_id:t.dataset.id});

  refresh(true);return}
 if(k==="show-cmd"){drawer(`<div class="ovh"><span class="t">Команда установки</span><button class="x" data-act="dr-x">✕</button></div><div class="cmd">${esc(installCmd(t.dataset.token))}</div>`);return}
 if(k==="del-enroll"){await api("/api/enroll/"+t.dataset.token,null,"DELETE");toast("Токен удалён","warn");refresh(true);return}
 if(k==="dossier"){const u=S.rating.find(x=>x.id===t.dataset.id);
  const ts=(S.tasks||[]).filter(x=>x.user_id===u.id).slice(0,12);

document.addEventListener("input",async e=>{
 const el=e.target;
 if(el.id==="rq"){UI.rq=el.value;render();const n=$("#rq");n.focus();n.setSelectionRange(el.value.length,el.value.length);return}
 if(el.id==="aq"){UI.aq=el.value;render();const n=$("#aq");n.focus();n.setSelectionRange(el.value.length,el.value.length);return}
 if(el.id==="c-int"){el.previousElementSibling.querySelector("output").textContent=el.value+" с";await api("/api/campaign",{cfg:{interval:+el.value}});return}
 if(el.id==="c-ceil"){el.previousElementSibling.querySelector("output").textContent="L"+el.value;await api("/api/campaign",{cfg:{ceiling:+el.value}});return}
 if(el.dataset.live){el.previousElementSibling.querySelector("output").textContent=el.value;
  await api(`/api/task/${el.dataset.id}/control`,{[el.dataset.live]:+el.value});return}
});
document.addEventListener("change",async e=>{

 if(el.id==="al"){UI.al=el.value;render()} if(el.id==="as"){UI.as=el.value;render()} if(el.id==="rs"){UI.rs=el.value;render()}

addEventListener("resize",()=>{if(S&&S.me)after()});

 await refresh(true);
